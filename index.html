  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- LUCIDE ICON HELPER FOR CDN COMPATIBILITY ---
    const IconWrapper = ({ name, className = "w-4 h-4", ...props }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {

          if (window.lucide) {
            window.lucide.createIcons({
              attrs: { class: className },
              nameAttr: 'data-lucide'
            });
          }
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" {...props} />;
    };

    // --- SOUND SYNTHESIZER (WEB AUDIO API) ---
    const playSound = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'complete') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.08);
            osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
          });
        } else if (type === 'levelup') {
          const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.09);
            osc.stop(ctx.currentTime + idx * 0.09 + 0.35);
          });
        } else if (type === 'loot') {
          for (let i = 0; i < 6; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600 + i * 250, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.2);
          }
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch (e) {}
    };

    // --- DATA CATALOG & CONSTANTS ---
    const HABIT_CATEGORIES = [

      { id: 'phoenix_hatchling', name: 'Phoenix Hatchling', rarity: 'Epic', type: 'pet', streakReq: 21, category: 'Reading', stats: { knowledge: 20, focus: 15 }, desc: 'Reborn from ashes, inspiring eternal learning.', icon: '🦅' },
      { id: 'ocean_dragon', name: 'Ocean Dragon', rarity: 'Epic', type: 'pet', streakReq: 21, category: 'Water', stats: { discipline: 25 }, desc: 'Serene aquatic dragon that guides water habits.', icon: '🐲' },

      { id: 'staff_eternity', name: 'Staff of Eternity', rarity: 'Legendary', type: 'weapon', streakReq: 30, category: 'Reading', stats: { knowledge: 50 }, desc: 'Channels cosmic knowledge into unstoppable focus.', icon: '🪄🌟' },
      { id: 'robo_owl', name: 'Robo Owl Pet', rarity: 'Legendary', type: 'pet', streakReq: 30, category: 'Coding', stats: { focus: 35, knowledge: 20 }, desc: 'Autonomous companion optimizing your cognitive workflows.', icon: '🤖🦉' },
      { id: 'celestial_dragon', name: 'Celestial Dragon', rarity: 'Mythic', type: 'pet', streakReq: 40, category: 'General', stats: { strength: 30, focus: 30, knowledge: 30, discipline: 30 }, desc: 'A mythical cosmic beast embodying supreme habit mastery.', icon: '🐲✨' },

      { id: 'castle_skin', name: 'Legendary Castle Skin', rarity: 'Mythic', type: 'artifact', streakReq: 40, category: 'General', stats: { discipline: 50 }, desc: 'Transforms your domain into a sprawling floating citadel.', icon: '🏰' }

    // ZERO STREAK INITIAL HABITS
    const INITIAL_HABITS = [
      { id: 'h1', name: 'Morning Workout ⚔️', category: 'Fitness', difficulty: 'Rare', currentStreak: 0, completedToday: false, xpReward: 50, goldReward: 25, reminderTime: '08:00', history: [] },
      { id: 'h2', name: 'Read 20 Pages 📚', category: 'Reading', difficulty: 'Common', currentStreak: 0, completedToday: false, xpReward: 30, goldReward: 15, reminderTime: '21:00', history: [] },
      { id: 'h3', name: 'Drink 3L Water 💧', category: 'Water', difficulty: 'Common', currentStreak: 0, completedToday: false, xpReward: 15, goldReward: 10, reminderTime: '12:00', history: [] },
      { id: 'h4', name: 'Meditation 🧘', category: 'Meditation', difficulty: 'Common', currentStreak: 0, completedToday: false, xpReward: 25, goldReward: 12, reminderTime: '07:30', history: [] },
      { id: 'h5', name: 'Coding Practice 💻', category: 'Coding', difficulty: 'Epic', currentStreak: 0, completedToday: false, xpReward: 60, goldReward: 30, reminderTime: '16:00', history: [] },
      { id: 'h6', name: 'Language Learning 🌐', category: 'Language', difficulty: 'Rare', currentStreak: 0, completedToday: false, xpReward: 35, goldReward: 18, reminderTime: '19:00', history: [] }
    ];

    const GET_RANK_TITLE = (streak) => {
      if (streak >= 40) return { title: 'Legend', color: 'from-rose-500 via-amber-400 to-yellow-300' };
      if (streak >= 30) return { title: 'Hero', color: 'from-amber-400 to-yellow-500' };
      if (streak >= 21) return { title: 'Champion', color: 'from-purple-400 to-indigo-500' };
      if (streak >= 15) return { title: 'Knight', color: 'from-blue-400 to-cyan-500' };
      if (streak >= 7) return { title: 'Warrior', color: 'from-emerald-400 to-teal-500' };
      if (streak >= 3) return { title: 'Adventurer', color: 'from-slate-300 to-slate-400' };
      return { title: 'Recruit', color: 'from-slate-500 to-slate-600' };
    };

    const RARITY_COLORS = {
      Common: { text: 'text-slate-300', border: 'border-slate-600', bg: 'bg-slate-800/80', glow: 'shadow-slate-500/20' },
      Rare: { text: 'text-blue-400', border: 'border-blue-500', bg: 'bg-blue-950/80', glow: 'shadow-blue-500/30' },
      Epic: { text: 'text-purple-400', border: 'border-purple-500', bg: 'bg-purple-950/80', glow: 'shadow-purple-500/40' },
      Legendary: { text: 'text-amber-400', border: 'border-amber-500', bg: 'bg-amber-950/80', glow: 'shadow-amber-500/50' },
      Mythic: { text: 'text-rose-400 border-rose-500', border: 'border-rose-500', bg: 'bg-rose-950/80', glow: 'shadow-rose-500/60' }
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [soundEnabled, setSoundEnabled] = useState(true);

      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('questforge_user');
        return saved ? JSON.parse(saved) : {
          name: 'Sir Questalot',
          avatar: null,
          level: 1,
          xp: 0,
          xpMax: 100,
          gold: 0,
          totalStreak: 0,
          unlockedItemIds: [],
          equipped: {
            weapon: null,
            armor: null,
            helmet: null,
            pet: null,
            artifact: null
          }
        };
      });

      const [habits, setHabits] = useState(() => {
        const saved = localStorage.getItem('questforge_habits');
        return saved ? JSON.parse(saved) : INITIAL_HABITS;
      });

      const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
      const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
      const [editingHabit, setEditingHabit] = useState(null);
      const [lootModalItem, setLootModalItem] = useState(null);
      const [levelUpModal, setLevelUpModal] = useState(null);
      const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);
      const [selectedInventoryItem, setSelectedInventoryItem] = useState(null);

      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        localStorage.setItem('questforge_user', JSON.stringify(user));
      }, [user]);

      useEffect(() => {
        localStorage.setItem('questforge_habits', JSON.stringify(habits));
      }, [habits]);

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const characterStats = useMemo(() => {
        let base = { discipline: 10, focus: 10, strength: 10, knowledge: 10 };
        Object.values(user.equipped).forEach(itemId => {
          if (!itemId) return;
          const item = REWARDS_MASTER.find(r => r.id === itemId);
          if (item && item.stats) {
            Object.entries(item.stats).forEach(([statKey, val]) => {
              if (base[statKey] !== undefined) {
                base[statKey] += val;
              }
            });
          }
        });
        return base;
      }, [user.equipped]);

      const handleCompleteQuest = (habitId) => {
        const todayStr = new Date().toISOString().split('T')[0];
        let xpGained = 0;
        let goldGained = 0;
        let newStreak = 0;

        setHabits(prevHabits =>
          prevHabits.map(h => {
            if (h.id === habitId) {
              if (h.completedToday) return h;
              xpGained = h.xpReward;
              goldGained = h.goldReward;
              newStreak = h.currentStreak + 1;

              return {
                ...h,
                completedToday: true,
                currentStreak: newStreak,
                history: [...new Set([...h.history, todayStr])]
              };
            }
            return h;
          })
        );

        if (xpGained === 0) return;

        playSound('complete', soundEnabled);

        let newXp = user.xp + xpGained;
        let newGold = user.gold + goldGained;
        let newLevel = user.level;
        let newXpMax = user.xpMax;
        let leveledUp = false;

        if (newXp >= user.xpMax) {
          newLevel += 1;
          newXp = newXp - user.xpMax;
          newXpMax = Math.floor(user.xpMax * 1.2);
          leveledUp = true;
        }

        let newlyUnlockedItem = null;
        const availableRewards = REWARDS_MASTER.filter(r => r.streakReq <= newStreak && !user.unlockedItemIds.includes(r.id));
        if (availableRewards.length > 0) {
          newlyUnlockedItem = availableRewards[0];
        }

        setUser(prev => ({
          ...prev,
          level: newLevel,
          xp: newXp,
          xpMax: newXpMax,
          gold: newGold,
          totalStreak: Math.max(prev.totalStreak, newStreak),
          unlockedItemIds: newlyUnlockedItem
            ? [...prev.unlockedItemIds, newlyUnlockedItem.id]
            : prev.unlockedItemIds
        }));

        if (leveledUp) {
          setTimeout(() => {
            playSound('levelup', soundEnabled);
            setLevelUpModal(newLevel);
          }, 400);
        }

        if (newlyUnlockedItem) {
          setTimeout(() => {
            playSound('loot', soundEnabled);
            setLootModalItem(newlyUnlockedItem);
          }, leveledUp ? 1200 : 500);
        }
      };

      const handleSaveHabit = (newHabitData) => {
        if (editingHabit) {
          setHabits(prev => prev.map(h => h.id === editingHabit.id ? { ...h, ...newHabitData } : h));
          setEditingHabit(null);
        } else {
          const habit = {
            id: 'h_' + Date.now(),
            ...newHabitData,
            currentStreak: 0,
            completedToday: false,
            history: []
          };
          setHabits(prev => [...prev, habit]);
        }
        setIsCreateModalOpen(false);
      };

      const handleDeleteHabit = (id) => {
        if (window.confirm("Are you sure you want to abandon and delete this habit quest?")) {
          setHabits(prev => prev.filter(h => h.id !== id));
          playSound('click', soundEnabled);
        }
      };

      const handleSaveProfile = (profileData) => {
        setUser(prev => ({ ...prev, name: profileData.name, avatar: profileData.avatar }));
        playSound('click', soundEnabled);
      };

      const handleEquipItem = (item) => {
        playSound('click', soundEnabled);
        setUser(prev => ({
          ...prev,
          equipped: {
            ...prev.equipped,
            [item.type]: prev.equipped[item.type] === item.id ? null : item.id
          }
        }));
      };

      const handleResetData = () => {
        if (window.confirm("Reset QuestForge data to initial state?")) {
          localStorage.removeItem('questforge_user');
          localStorage.removeItem('questforge_habits');
          window.location.reload();
        }
      };

      const formattedDate = currentTime.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      const formattedTime = currentTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const currentRank = GET_RANK_TITLE(user.totalStreak);

      return (
        <div className="min-h-screen bg-[#0E1117] text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-900 pb-20 md:pb-6">
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-purple-900/20 rounded-full blur-3xl"></div>
            <div className="absolute top-1/3 -right-40 w-96 h-96 bg-amber-600/15 rounded-full blur-3xl"></div>
            <div className="absolute -bottom-40 left-1/3 w-96 h-96 bg-emerald-900/15 rounded-full blur-3xl"></div>
          </div>

          <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">

            {/* TOP HEADER BAR */}
            <header className="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-amber-500/20 shadow-lg mb-6">
              <div className="flex items-center gap-3">
                <div className="relative flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-purple-600 text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20">
                  ⚔️
                </div>
                <div>
                  <h1 className="text-2xl font-bold bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 bg-clip-text text-transparent font-serif tracking-wide">
                    QuestForge
                  </h1>
                  <p className="text-xs text-slate-400 flex items-center gap-2">
                    <span>Habit RPG</span>
                    <span className="inline-block w-1 h-1 rounded-full bg-amber-500"></span>
                    <span className="text-amber-400/90 font-medium">{formattedDate} • {formattedTime}</span>
                  </p>
                </div>
              </div>

              {/* QUICK STATS HEADER BADGES */}
              <div className="flex items-center gap-3 sm:gap-4 overflow-x-auto py-1">
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/60">
                  <span className="text-xs text-slate-400">Level</span>
                  <span className="font-bold text-amber-400">{user.level}</span>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/60">
                  <Zap className="w-4 h-4 text-amber-400" />
                  <div className="flex flex-col">
                    <span className="text-[10px] text-slate-400 leading-none">XP</span>
                    <span className="text-xs font-semibold text-slate-200">{user.xp}/{user.xpMax}</span>
                  </div>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-amber-500/30">
                  <span className="text-amber-400 font-bold">🪙</span>

    // ==========================================
    // PAGE 3: CALENDAR VIEW
    // ==========================================
    function CalendarView({ habits, onSelectDay }) {
      const [currentMonth, setCurrentMonth] = useState(new Date(2026, 6, 1));

      const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
      const firstDayOfWeek = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();

      const monthName = currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const calendarDays = useMemo(() => {
        const days = [];
        const year = currentMonth.getFullYear();
        const month = (currentMonth.getMonth() + 1).toString().padStart(2, '0');

        for (let d = 1; d <= daysInMonth; d++) {
          const dayStr = `${year}-${month}-${d.toString().padStart(2, '0')}`;
          
          const completedOnDay = habits.filter(h => h.history.includes(dayStr));
          const count = completedOnDay.length;

          let status = 'none';
          if (count === habits.length && habits.length > 0) {
            status = 'completed';
          } else if (count > 0) {
            status = 'streak';
          }

          const isRewardDay = d % 7 === 0;

          days.push({
            dateNumber: d,
            dateStr: dayStr,
            completedCount: count,
            totalHabits: habits.length,
            status,
            isRewardDay,
            completedQuests: completedOnDay
          });
        }
        return days;
      }, [currentMonth, habits, daysInMonth]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
            <div>
              <h2 className="text-xl font-bold font-serif text-slate-100 flex items-center gap-2">
                <Calendar className="w-5 h-5 text-amber-400" />
                RPG Monthly Quest Log
              </h2>
              <p className="text-xs text-slate-400">Track your daily habit consistency and claim milestone rewards.</p>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1))}
                className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
              >
                ‹
              </button>
              <span className="text-sm font-bold text-amber-300 font-serif min-w-[120px] text-center">
                {monthName}
              </span>
              <button
                onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1))}
                className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
              >
                ›
              </button>
            </div>
          </div>

          <div className="flex flex-wrap items-center gap-4 text-xs bg-slate-900/50 p-3 rounded-xl border border-slate-800">
            <span className="flex items-center gap-1.5 text-emerald-400 font-medium">
              <span>✅</span> Completed All
            </span>
            <span className="flex items-center gap-1.5 text-amber-400 font-medium">
              <span>🔥</span> Partial Streak
            </span>
            <span className="flex items-center gap-1.5 text-purple-400 font-medium">
              <span>🏆</span> Reward Day
            </span>
          </div>

          <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 shadow-xl">
            <div className="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 pb-3 border-b border-slate-800">
              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>
            </div>

            <div className="grid grid-cols-7 gap-2 pt-3">
              {Array.from({ length: firstDayOfWeek }).map((_, idx) => (
                <div key={`empty-${idx}`} className="h-16 sm:h-20 rounded-xl bg-slate-950/30"></div>
              ))}

              {calendarDays.map(day => (
                <div
                  key={day.dateStr}
                  onClick={() => onSelectDay(day)}
                  className={`h-16 sm:h-20 rounded-xl p-1.5 border transition cursor-pointer flex flex-col justify-between hover:scale-[1.03] ${
                    day.status === 'completed'
                      ? 'bg-emerald-950/40 border-emerald-500/50 hover:bg-emerald-900/50'
                      : day.status === 'streak'
                      ? 'bg-amber-950/40 border-amber-500/40 hover:bg-amber-900/50'
                      : 'bg-slate-950/60 border-slate-800/80 hover:border-slate-700'
                  }`}
                >
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold text-slate-300">{day.dateNumber}</span>
                    {day.isRewardDay && <span className="text-xs">🏆</span>}
                  </div>

                  <div className="text-center my-auto text-sm">
                    {day.status === 'completed' && <span>✅</span>}
                    {day.status === 'streak' && <span>🔥</span>}
                  </div>

                  <div className="text-[9px] text-center text-slate-400 font-mono">
                    {day.completedCount}/{day.totalHabits} Quests
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

                    const rewardItem = REWARDS_MASTER.find(
                      r => r.streakReq === milestone && (r.category === habit.category || r.category === 'General')
                    ) || REWARDS_MASTER[0];

                    const isReached = habit.currentStreak >= milestone;

                    return (
                      <div key={milestone} className="relative group">
                        <div
                          className={`absolute -left-[31px] sm:-left-[39px] top-1/2 -translate-y-1/2 w-8 h-8 rounded-full border-2 flex items-center justify-center font-bold text-xs transition-all ${
                            isReached
                              ? 'bg-amber-400 border-amber-300 text-slate-950 shadow-lg shadow-amber-500/40'
                              : 'bg-slate-950 border-slate-700 text-slate-500'
                          }`}
                        >
                          {isReached ? '✓' : milestone}
                        </div>

                        <div
                          className={`p-4 rounded-2xl border transition-all flex items-center justify-between gap-4 ${
                            isReached
                              ? 'bg-slate-900 border-amber-500/40 shadow-xl'
                              : 'bg-slate-950/40 border-slate-800/80 opacity-60'
                          }`}
                        >
                          <div className="flex items-center gap-4">
                            <div className="text-3xl">{rewardItem.icon}</div>
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="text-xs font-extrabold text-amber-400">{milestone}-Day Milestone</span>
                                <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                                  {rewardItem.rarity}
                                </span>
                              </div>
                              <h5 className="font-bold text-sm text-slate-100">{rewardItem.name}</h5>
                              <p className="text-xs text-slate-400 max-w-md">{rewardItem.desc}</p>
                            </div>
                          </div>

                          <div>
                            {isReached ? (
                              <span className="px-3 py-1.5 rounded-xl bg-emerald-950 border border-emerald-500/40 text-emerald-400 text-xs font-bold flex items-center gap-1">
                                <Check className="w-3.5 h-3.5" /> Unlocked
                              </span>
                            ) : (
                              <span className="px-3 py-1.5 rounded-xl bg-slate-950 text-slate-500 text-xs font-bold border border-slate-800 flex items-center gap-1">
                                <Lock className="w-3.5 h-3.5" /> Locked
                              </span>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // PAGE 7: REMINDER CENTER
    // ==========================================
    function ReminderCenterView({ habits, onComplete }) {
      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
            <h2 className="text-xl font-bold font-serif text-slate-100 flex items-center gap-2">
              <Bell className="w-5 h-5 text-amber-400" />
              Smart Quest Reminder Center
            </h2>
            <p className="text-xs text-slate-400">Deadlines, upcoming habit timers, and persistent quest notifications.</p>
          </div>

          <div className="p-4 rounded-2xl bg-gradient-to-r from-amber-500/20 via-amber-600/10 to-slate-900 border border-amber-500/50 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xl">
            <div className="flex items-center gap-3">
              <div className="p-3 rounded-xl bg-amber-500 text-slate-950 font-bold">
                <AlertTriangle className="w-6 h-6" />
              </div>
              <div>
                <h4 className="font-bold text-slate-100 text-sm">⚠️ Workout Quest Pending!</h4>
                <p className="text-xs text-slate-300">Reward at 15 Days: <strong className="text-amber-300">Shadow Blade 🗡️</strong></p>
              </div>
            </div>

            <button
              onClick={() => onComplete(habits[0]?.id)}
              className="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs transition shadow-md shadow-amber-500/20 whitespace-nowrap"
            >
              Complete Quest Now
            </button>
          </div>

          <div className="space-y-4">
            <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400">Scheduled Daily Reminders</h3>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {habits.map(habit => (
                <div
                  key={habit.id}
                  className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-center justify-between gap-4 shadow-lg"
                >
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 rounded-xl bg-slate-800 text-amber-400">
                      <Clock className="w-5 h-5" />
                    </div>
                    <div>
                      <h4 className="font-bold text-sm text-slate-200">{habit.name}</h4>
                      <p className="text-xs text-slate-400">Scheduled for <strong className="text-amber-300">{habit.reminderTime || '09:00 AM'}</strong></p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => alert(`Snoozed ${habit.name} for 1 Hour.`)}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition"
                    >
                      Snooze
                    </button>
                    {habit.completedToday ? (
                      <span className="text-xs text-emerald-400 font-bold">Done ✅</span>
                    ) : (
                      <button
                        onClick={() => onComplete(habit.id)}
                        className="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-bold transition hover:bg-emerald-400"
                      >
                        Done
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // PAGE 8: ANALYTICS
    // ==========================================
    function AnalyticsView({ habits, user }) {
      const heatmapCells = useMemo(() => {
        const cells = [];
        for (let i = 0; i < 120; i++) {
          const level = Math.floor(Math.random() * 4);
          cells.push({ id: i, intensity: level });
        }
        return cells;
      }, []);

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
            <h2 className="text-xl font-bold font-serif text-slate-100 flex items-center gap-2">
              <BarChart2 className="w-5 h-5 text-amber-400" />
              Advanced RPG Habit Analytics
            </h2>
            <p className="text-xs text-slate-400">Consistency heatmap, streak metrics, and habit ranking tier list.</p>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-center space-y-1">
              <div className="text-xs text-slate-400">Highest Streak</div>
              <div className="text-2xl font-extrabold text-amber-400">{user.totalStreak} Days 🔥</div>
            </div>
            <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-center space-y-1">
              <div className="text-xs text-slate-400">Average Streak</div>
              <div className="text-2xl font-extrabold text-blue-400">0.0 Days</div>
            </div>
            <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-center space-y-1">
              <div className="text-xs text-slate-400">Monthly Completion</div>
              <div className="text-2xl font-extrabold text-emerald-400">0%</div>
            </div>
            <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-center space-y-1">
              <div className="text-xs text-slate-400">Quests Finished</div>
              <div className="text-2xl font-extrabold text-purple-400">0 Quests</div>
            </div>
          </div>

          <div className="p-6 rounded-3xl bg-slate-900/90 border border-slate-800 space-y-4 shadow-xl">
            <h3 className="text-sm font-bold text-slate-200 flex items-center justify-between">
              <span>Annual Consistency Grid</span>
              <span className="text-xs text-slate-400 font-normal">Multi-Month Activity</span>
            </h3>

            <div className="flex flex-wrap gap-1.5 justify-center py-2">
              {heatmapCells.map(cell => {
                const colors = ['bg-slate-950 border-slate-800', 'bg-emerald-950 border-emerald-800', 'bg-emerald-700 border-emerald-600', 'bg-emerald-400 border-emerald-300'];
                return (
                  <div
                    key={cell.id}
                    className={`w-3.5 h-3.5 rounded-sm border ${colors[cell.intensity]} transition hover:scale-125`}
                    title={`Activity Level ${cell.intensity}`}
                  ></div>
                );
              })}
            </div>

            <div className="flex items-center justify-end gap-2 text-[10px] text-slate-400 pt-2">
              <span>Less</span>
              <span className="w-3 h-3 bg-slate-950 border border-slate-800 rounded"></span>
              <span className="w-3 h-3 bg-emerald-950 border border-emerald-800 rounded"></span>
              <span className="w-3 h-3 bg-emerald-700 border border-emerald-600 rounded"></span>
              <span className="w-3 h-3 bg-emerald-400 border border-emerald-300 rounded"></span>
              <span>More</span>
            </div>
          </div>

          <div className="p-6 rounded-3xl bg-slate-900/90 border border-slate-800 space-y-4 shadow-xl">
            <h3 className="text-sm font-bold text-slate-200">Habit Consistency Rankings</h3>

            <div className="space-y-3">
              {habits.slice().sort((a,b) => b.currentStreak - a.currentStreak).map((habit, idx) => (
                <div key={habit.id} className="p-3.5 rounded-2xl bg-slate-950/60 border border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="font-extrabold text-amber-400 text-sm">#{idx + 1}</span>
                    <span className="font-bold text-slate-200 text-sm">{habit.name}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-xs text-slate-400">{habit.category}</span>
                    <span className="text-xs font-bold text-amber-400">{habit.currentStreak} Days 🔥</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODAL COMPONENTS
    // ==========================================

    function EditProfileModal({ user, onSave, onClose }) {
      const [name, setName] = useState(user.name || 'Sir Questalot');
      const [avatar, setAvatar] = useState(user.avatar || null);

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAvatar(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ name, avatar });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="relative w-full max-w-md rounded-3xl bg-slate-900 border border-amber-500/40 p-6 shadow-2xl space-y-5">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-100">
              <X className="w-5 h-5" />
            </button>

            <h3 className="text-lg font-bold font-serif text-amber-400 flex items-center gap-2">
              <User className="w-5 h-5" /> Customize Knight Profile
            </h3>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block text-slate-300 font-bold mb-1">Knight Name</label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="e.g. Sir Lancelot"
                  className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-400 text-sm"
                  required
                />
              </div>

              <div>
                <label className="block text-slate-300 font-bold mb-2">Avatar Photo</label>
                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-2xl bg-slate-950 border border-slate-700 flex items-center justify-center overflow-hidden text-2xl flex-shrink-0">
                    {avatar ? <img src={avatar} className="w-full h-full object-cover" /> : <span>🛡️</span>}
                  </div>
                  
                  <div className="space-y-1">
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleFileChange}
                      className="text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer"
                    />
                    {avatar && (
                      <button
                        type="button"
                        onClick={() => setAvatar(null)}
                        className="block text-[11px] text-rose-400 hover:underline pt-1"
                      >
                        Remove custom photo
                      </button>
                    )}
                  </div>
                </div>
              </div>

              <button
                type="submit"
                className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-extrabold text-sm shadow-lg hover:from-amber-400 transition"
              >
                Save Knight Profile
              </button>
            </form>
          </div>
        </div>
      );
    }

    function CreateHabitModal({ habitToEdit, onSave, onClose }) {
      const [name, setName] = useState(habitToEdit?.name || '');
      const [category, setCategory] = useState(habitToEdit?.category || 'Fitness');
      const [difficulty, setDifficulty] = useState(habitToEdit?.difficulty || 'Rare');
      const [reminderTime, setReminderTime] = useState(habitToEdit?.reminderTime || '09:00');
      const [xpReward, setXpReward] = useState(habitToEdit?.xpReward || 35);
      const [goldReward, setGoldReward] = useState(habitToEdit?.goldReward || 15);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          name,
          category,
          difficulty,
          reminderTime,
          xpReward: parseInt(xpReward),
          goldReward: parseInt(goldReward)
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="relative w-full max-w-md rounded-3xl bg-slate-900 border border-amber-500/40 p-6 shadow-2xl space-y-5">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-100">
              <X className="w-5 h-5" />
            </button>

            <h3 className="text-lg font-bold font-serif text-amber-400 flex items-center gap-2">
              <Sword className="w-5 h-5" />
              {habitToEdit ? 'Edit Habit Quest' : 'Forge New Habit Quest'}
            </h3>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block text-slate-300 font-bold mb-1">Quest Name</label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="e.g. Morning Workout ⚔️"
                  className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-400"
                  required
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 font-bold mb-1">Category</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5"
                  >
                    {HABIT_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-slate-300 font-bold mb-1">Difficulty</label>
                  <select
                    value={difficulty}
                    onChange={(e) => setDifficulty(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5"
                  >
                    <option value="Common">Common</option>
                    <option value="Rare">Rare</option>
                    <option value="Epic">Epic</option>
                    <option value="Legendary">Legendary</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-slate-300 font-bold mb-1">Reminder Time</label>
                <input
                  type="time"
                  value={reminderTime}
                  onChange={(e) => setReminderTime(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 font-bold mb-1">XP Gain</label>
                  <input
                    type="number"
                    value={xpReward}
                    onChange={(e) => setXpReward(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5"
                  />
                </div>
                <div>
                  <label className="block text-slate-300 font-bold mb-1">Gold Gain</label>
                  <input
                    type="number"
                    value={goldReward}
                    onChange={(e) => setGoldReward(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5"
                  />
                </div>
              </div>

              <button
                type="submit"
                className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/20 hover:from-amber-400 hover:to-amber-500 transition mt-2"
              >
                {habitToEdit ? 'Save Quest Changes' : 'Forge Quest'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function LootRevealModal({ item, onClose, onEquip }) {
      const rarityStyle = RARITY_COLORS[item.rarity] || RARITY_COLORS.Legendary;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-lg">
          <div className={`relative w-full max-w-sm rounded-3xl ${rarityStyle.bg} border-2 ${rarityStyle.border} p-6 shadow-2xl text-center space-y-5`}>
            <div className="text-xs uppercase tracking-widest font-extrabold text-amber-400">
              ✨ LEGENDARY STREAK UNLOCK ✨
            </div>

            <div className="text-6xl py-4 animate-pulse">
              {item.icon}
            </div>

            <div>
              <span className={`text-xs uppercase font-extrabold ${rarityStyle.text}`}>{item.rarity} {item.type}</span>
              <h3 className="text-2xl font-bold font-serif text-slate-100 mt-1">{item.name}</h3>
              <p className="text-xs text-slate-300 mt-2">{item.desc}</p>
            </div>

            <div className="flex gap-2">
              <button
                onClick={onEquip}
                className="flex-1 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs shadow-lg shadow-amber-500/20"
              >
                Equip Now
              </button>
              <button
                onClick={onClose}
                className="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs"
              >
                Vault Item
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LevelUpModal({ level, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-lg">
          <div className="w-full max-w-sm rounded-3xl bg-gradient-to-b from-purple-900 to-slate-900 border-2 border-amber-400 p-6 text-center space-y-4 shadow-2xl">
            <div className="text-5xl">⚡ HERO LEVEL UP! ⚡</div>
            <h3 className="text-3xl font-extrabold text-amber-400 font-serif">Level {level}</h3>
            <p className="text-xs text-slate-300">Your habit consistency has elevated your hero stats! Gold capacity and quest rewards increased.</p>
            <button
              onClick={onClose}
              className="w-full py-2.5 rounded-xl bg-amber-400 text-slate-950 font-bold text-xs shadow-lg"
            >
              Claim Glory
            </button>
          </div>
        </div>
      );
    }

    function CalendarDayDetailModal({ dayData, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="relative w-full max-w-md rounded-3xl bg-slate-900 border border-slate-700 p-6 space-y-4 shadow-2xl">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-100">
              <X className="w-5 h-5" />
            </button>

            <h3 className="text-lg font-bold font-serif text-amber-400">
              Quest Log for {dayData.dateStr}
            </h3>

            <div className="space-y-2 text-xs">
              <div className="p-3 rounded-xl bg-slate-950 border border-slate-800">
                Completed: <strong className="text-amber-300">{dayData.completedCount} / {dayData.totalHabits} Habits</strong>
              </div>

              <div className="space-y-1 pt-2">
                <h4 className="font-bold text-slate-300">Completed Habits:</h4>
                {dayData.completedQuests.length > 0 ? (
                  dayData.completedQuests.map(q => (
                    <div key={q.id} className="p-2 rounded-lg bg-emerald-950/40 border border-emerald-500/30 text-emerald-300">
                      ✓ {q.name} (+{q.xpReward} XP)
                    </div>
                  ))
                ) : (
                  <p className="text-slate-500 italic">No habits logged for this date.</p>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ItemDetailModal({ item, isEquipped, isUnlocked, onEquip, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="relative w-full max-w-sm rounded-3xl bg-slate-900 border border-amber-500/30 p-6 space-y-4 text-center shadow-2xl">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-100">
              <X className="w-5 h-5" />
            </button>

            <div className="text-5xl py-2">{item.icon}</div>
            <h3 className="text-xl font-bold font-serif text-slate-100">{item.name}</h3>
            <p className="text-xs text-amber-400 font-semibold uppercase">{item.rarity} {item.type}</p>
            <p className="text-xs text-slate-300">{item.desc}</p>

            {isUnlocked ? (
              <button
                onClick={onEquip}
                className="w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs shadow-lg"
              >
                {isEquipped ? 'Unequip Item' : 'Equip Item'}
              </button>
            ) : (
              <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-400">
                Requires {item.streakReq}-Day Habit Streak
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
